name: Extract front2 templates

on:
  push:
    branches:
      - agent/rebate-portfolio-50plus-5000-20260807
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search current tree and git history for verified templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, re, os

          ROOT=Path('.')
          OUT=Path('/tmp/front2_extract')
          OUT.mkdir(parents=True, exist_ok=True)
          KEYS=['前二','直选复式','CAT02','中三','组三单式','高级开某投某','定码轮换']
          report=[]
          seen=set()

          def dec(raw):
              for enc in ('utf-8-sig','gbk','utf-8','cp936'):
                  try: return raw.decode(enc), enc
                  except Exception: pass
              return None, None

          def save_match(origin, path, raw):
              text,enc=dec(raw)
              hay=str(path)+'\n'+(text or '')
              if not any(k in hay for k in KEYS): return
              key=(origin,str(path),raw[:64],len(raw))
              if key in seen: return
              seen.add(key)
              report.append(f'===== ORIGIN: {origin} | FILE: {path} | decoded={enc} | bytes={len(raw)} =====\n')
              report.append(text if text is not None else '<BINARY/UNDECODABLE>')
              report.append('\n\n')
              safe=re.sub(r'[^0-9A-Za-z._-]+','_',f'{len(seen):03d}_{Path(str(path)).name}')[:180]
              (OUT/safe).write_bytes(raw)

          # Current tree including archives.
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try:
                  if p.suffix.lower()=='.zip':
                      with zipfile.ZipFile(p) as z:
                          for info in z.infolist():
                              if info.is_dir(): continue
                              try: save_match(f'ZIP:{p}', info.filename, z.read(info))
                              except Exception: pass
                  elif p.suffix.lower() in {'.txt','.md','.json','.jsonl','.csv'}:
                      save_match('CURRENT', p.as_posix(), p.read_bytes())
              except Exception: pass

          # Find matching files in every historical tree. This also recovers deleted rollback ZIPs.
          commits=subprocess.check_output(['git','rev-list','--all'], text=True).splitlines()
          historical_paths=[]
          for ci,commit in enumerate(commits):
              try:
                  listing=subprocess.check_output(['git','ls-tree','-r','--name-only',commit], text=True, errors='replace').splitlines()
              except Exception:
                  continue
              for path in listing:
                  name=Path(path).name
                  interesting_name=any(k in path for k in KEYS) or ('V3.8.1' in path) or ('回滚源' in path and path.lower().endswith('.zip'))
                  if not interesting_name: continue
                  marker=(commit,path)
                  if marker in historical_paths: continue
                  historical_paths.append(marker)
                  try:
                      raw=subprocess.check_output(['git','show',f'{commit}:{path}'])
                  except Exception:
                      continue
                  if path.lower().endswith('.zip'):
                      temp=OUT/'historical_rollback.zip'
                      temp.write_bytes(raw)
                      try:
                          with zipfile.ZipFile(temp) as z:
                              for info in z.infolist():
                                  if info.is_dir(): continue
                                  try: save_match(f'HISTZIP:{commit[:12]}:{path}', info.filename, z.read(info))
                                  except Exception: pass
                      except Exception as e:
                          report.append(f'ZIP_OPEN_ERROR {commit} {path}: {e}\n')
                  else:
                      save_match(f'HIST:{commit[:12]}', path, raw)

          (OUT/'matches_utf8.txt').write_text(''.join(report) if report else 'NO_MATCHES', encoding='utf-8')
          (OUT/'history_paths.txt').write_text('\n'.join(f'{c} {p}' for c,p in historical_paths), encoding='utf-8')
          (OUT/'summary.txt').write_text(f'commits={len(commits)}\nhistorical_candidates={len(historical_paths)}\nmatches={len(seen)}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: front2-template-extract
          path: /tmp/front2_extract
          if-no-files-found: error
