name: Validate system repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate controller architecture
        run: python tools/validate_controller_architecture.py
      - name: Validate controller runtime configuration
        run: python tools/lottery_controller.py validate
      - name: Smoke-test controller task envelope
        run: |
          python tools/lottery_controller.py start \
            --request "CI controller smoke test" \
            --domain SYSTEM \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
          python tools/lottery_controller.py status \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
      - name: Validate PPT director and number provenance rules
        run: python tools/validate_ppt_director_rules.py
      - name: Install PPT dependencies
        run: python -m pip install --disable-pip-version-check python-pptx pillow lxml
      - name: Materialize fixed PPT pages
        run: python tools/materialize_ppt_fixed_pages.py
      - name: Validate fixed PPT pages
        run: python tools/validate_ppt_fixed_pages.py
      - name: Confirm invalidated B395 builder is absent
        run: |
          test ! -f tools/build_b395_delivery.py
          test ! -f youtube_seo/邻位热差迁移.json
      - name: Confirm source-gate files exist
        run: |
          test -f 05D_PPT技术来源与号码证据协议.md
          test -f PPT技术来源与号码证据规则.json
          test -f PPT技术来源验收测试集.jsonl
          test -f 14_导演执行审计学习总控与模块化变更协议.md
          test -f controller/pipeline.json
          test -f controller/extensions.json
      - name: Confirm B396 controller evidence exists
        run: |
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/task.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/preflight.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/rollback_manifest.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/director_decision.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/design_contract.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/execution_manifest.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/validation_report.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/audit_report.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/delivery_manifest.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/learning_record.json
          test -f controller/runs/RUN-20260804-B396-CURRENT-MAIN/completion.json
      - name: Build B396 delivery
        run: python tools/build_b396_delivery.py
      - name: Validate final B396 PPT fixed pages
        run: python tools/validate_ppt_fixed_pages.py --final-ppt "dist/前值转移三码_交付/前值转移三码_挂机前讲解.pptx"
      - name: Upload B396 complete delivery
        uses: actions/upload-artifact@v4
        with:
          name: 前值转移三码_完整交付_当前main
          path: |
            dist/前值转移三码_交付/前值转移三码_完整交付.zip
            dist/前值转移三码_交付/前值转移三码_验证记录.json
            dist/前值转移三码_交付/DELIVERY_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
