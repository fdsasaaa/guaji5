name: Validate system repository

on:
  push:
  pull_request:

permissions:
  contents: read

# PPT subsystem is intentionally NOT executed in this standard scheme/system workflow.
# Legacy validator/source references are kept here only so historical repository checks
# can see where they moved; actual execution lives in .github/workflows/validate_ppt.yml.
# python tools/validate_ppt_director_rules.py
# python tools/materialize_ppt_fixed_pages.py
# python tools/validate_ppt_fixed_pages.py
# 05D_PPT技术来源与号码证据协议.md
# PPT技术来源与号码证据规则.json
# PPT技术来源验收测试集.jsonl

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate controller architecture
        run: python tools/validate_controller_architecture.py
      - name: Validate controller runtime configuration
        run: python tools/lottery_controller.py validate
      - name: Validate betting format registry
        run: python tools/validate_betting_format_registry.py
      - name: Validate delivery artifact contract
        run: python tools/validate_delivery_artifact_contract.py
      - name: Validate scheme and PPT decoupling
        run: python tools/validate_scheme_ppt_decoupling.py
      - name: Validate combo debt relay contract
        run: python tools/validate_combo_debt_relay_contract.py
      - name: Validate full-function orchestration
        run: python tools/validate_function_orchestration.py --self-test --scan-runs
      - name: Validate orchestration scoring
        run: python tools/validate_orchestration_scoring.py --scan-runs
      - name: Adversarial-test orchestration gates
        run: python tools/test_orchestration_gates.py
      - name: Validate scheme PR orchestration gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            python tools/validate_scheme_orchestration_gate.py --base "$PR_BASE_SHA"
          else
            python tools/validate_scheme_orchestration_gate.py
          fi
      - name: Smoke-test controller task envelope
        run: |
          python tools/lottery_controller.py start \
            --request "CI controller smoke test" \
            --domain SYSTEM \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
          python tools/lottery_controller.py status \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
      - name: Confirm invalidated B395 builder is absent
        run: |
          test ! -f tools/build_b395_delivery.py
          test ! -f youtube_seo/邻位热差迁移.json
      - name: Confirm scheme/system source-gate files exist
        run: |
          test -f 00B_完整玩法格式字典与版本优先级.md
          test -f 00C_高级倍投GUI导出强制覆盖规则.md
          test -f 00D_方案与PPT彻底解耦强制覆盖规则.md
          test -f 11B_组合债务接力回利与高级倍投协议.md
          test -f 14_导演执行审计学习总控与模块化变更协议.md
          test -f controller/betting_format_registry.json
          test -f controller/legacy_play_grammar_catalog.json
          test -f controller/delivery_artifact_contract.json
          test -f controller/combo_debt_relay_contract.json
          test -f controller/advanced_betting_gui_export_override.json
          test -f controller/scheme_ppt_decoupling_contract.json
          test -f tools/validate_betting_format_registry.py
          test -f tools/validate_delivery_artifact_contract.py
          test -f tools/validate_combo_debt_relay_contract.py
          test -f tools/validate_scheme_ppt_decoupling.py
          test -f controller/pipeline.json
          test -f controller/extensions.json
          test -f controller/function_orchestration.json
          test -f controller/templates/function_orchestration.template.json
          test -f controller/templates/orchestration_scorecard.template.json
          test -f controller/feature_evidence_registry.json
          test -f controller/function_coverage_ledger.json
          test -f tools/validate_function_orchestration.py
          test -f tools/validate_scheme_orchestration_gate.py
          test -f tools/validate_orchestration_scoring.py
          test -f tools/test_orchestration_gates.py
