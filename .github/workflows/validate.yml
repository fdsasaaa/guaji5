name: Validate system repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate controller architecture
        run: python tools/validate_controller_architecture.py
      - name: Validate controller runtime configuration
        run: python tools/lottery_controller.py validate
      - name: Validate full-function orchestration
        run: python tools/validate_function_orchestration.py --self-test --scan-runs
      - name: Validate orchestration scoring
        run: python tools/validate_orchestration_scoring.py --scan-runs
      - name: Adversarial-test orchestration gates
        run: python tools/test_orchestration_gates.py
      - name: Validate scheme PR orchestration gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            python tools/validate_scheme_orchestration_gate.py --base "$PR_BASE_SHA"
          else
            python tools/validate_scheme_orchestration_gate.py
          fi
      - name: Smoke-test controller task envelope
        run: |
          python tools/lottery_controller.py start \
            --request "CI controller smoke test" \
            --domain SYSTEM \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
          python tools/lottery_controller.py status \
            --run-id CI-SMOKE \
            --run-root "$RUNNER_TEMP/lottery-controller"
      - name: Validate PPT director and number provenance rules
        run: python tools/validate_ppt_director_rules.py
      - name: Install PPT dependencies
        run: python -m pip install --disable-pip-version-check python-pptx pillow lxml
      - name: Materialize fixed PPT pages
        run: python tools/materialize_ppt_fixed_pages.py
      - name: Validate fixed PPT pages
        run: python tools/validate_ppt_fixed_pages.py
      - name: Confirm invalidated B395 builder is absent
        run: |
          test ! -f tools/build_b395_delivery.py
          test ! -f youtube_seo/邻位热差迁移.json
      - name: Confirm source-gate files exist
        run: |
          test -f 05D_PPT技术来源与号码证据协议.md
          test -f PPT技术来源与号码证据规则.json
          test -f PPT技术来源验收测试集.jsonl
          test -f 14_导演执行审计学习总控与模块化变更协议.md
          test -f controller/pipeline.json
          test -f controller/extensions.json
          test -f controller/function_orchestration.json
          test -f controller/templates/function_orchestration.template.json
          test -f controller/templates/orchestration_scorecard.template.json
          test -f controller/feature_evidence_registry.json
          test -f controller/function_coverage_ledger.json
          test -f tools/validate_function_orchestration.py
          test -f tools/validate_scheme_orchestration_gate.py
          test -f tools/validate_orchestration_scoring.py
          test -f tools/test_orchestration_gates.py
      - name: Temporary extract rollback scheme templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          zpath = Path('04_回滚源/AI挂机方案生成系统工作包_V3.8.1_直接执行与热5码六期验证版.zip')
          out = Path('/tmp/front2_extract')
          out.mkdir(parents=True, exist_ok=True)
          if not zpath.exists():
              (out/'ERROR.txt').write_text(f'ZIP_NOT_FOUND: {zpath}', encoding='utf-8')
              raise SystemExit(0)
          keys = ['前二','直选复式','CAT02','中三','组三单式','高级开某投某','定码轮换','玩法类型','玩法名称']
          report=[]; listing=[]
          with zipfile.ZipFile(zpath) as z:
              for info in z.infolist():
                  listing.append(info.filename)
                  if info.is_dir(): continue
                  try: raw=z.read(info)
                  except Exception: continue
                  text=None; enc=None
                  for encoding in ('utf-8-sig','gbk','utf-8','cp936'):
                      try: text=raw.decode(encoding); enc=encoding; break
                      except Exception: pass
                  hay=info.filename+'\n'+(text or '')
                  if any(k in hay for k in keys):
                      report.append(f'===== FILE: {info.filename} | decoded={enc} | bytes={len(raw)} =====\n')
                      report.append(text if text is not None else '<BINARY/UNDECODABLE>')
                      report.append('\n\n')
          (out/'matches_utf8.txt').write_text(''.join(report) if report else 'NO_MATCHES', encoding='utf-8')
          (out/'zip_listing.txt').write_text('\n'.join(listing), encoding='utf-8')
          PY
      - name: Temporary upload rollback scheme templates
        uses: actions/upload-artifact@v4
        with:
          name: front2-template-extract
          path: /tmp/front2_extract
          if-no-files-found: error
