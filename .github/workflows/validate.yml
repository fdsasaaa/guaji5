name: Validate system repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate PPT director rules
        run: python tools/validate_ppt_director_rules.py
