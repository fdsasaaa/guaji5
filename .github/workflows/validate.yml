name: Validate system repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate PPT director rules
        run: python tools/validate_ppt_director_rules.py
      - name: Install PPT build dependencies
        run: python -m pip install --disable-pip-version-check python-pptx pillow lxml
      - name: Materialize fixed PPT pages
        run: python tools/materialize_ppt_fixed_pages.py
      - name: Validate fixed PPT pages
        run: python tools/validate_ppt_fixed_pages.py
      - name: Build current delivery
        run: python tools/build_b394_delivery.py
      - name: Upload current delivery
        uses: actions/upload-artifact@v4
        with:
          name: 冷热三角快照接力_交付
          path: dist/冷热三角快照接力_交付/**
          if-no-files-found: error
          retention-days: 7
