name: Validate independent player-teaching PPT subsystem

on:
  push:
    paths:
      - '05A_*'
      - '05B_*'
      - '05D_*'
      - '05E_*'
      - '05F_*'
      - 'PPT*'
      - '玩家教学PPT独立创建总控口述_*'
      - 'tools/*ppt*'
      - 'controller/scheme_ppt_decoupling_contract.json'
      - '.github/workflows/validate_ppt.yml'
  pull_request:
    paths:
      - '05A_*'
      - '05B_*'
      - '05D_*'
      - '05E_*'
      - '05F_*'
      - 'PPT*'
      - '玩家教学PPT独立创建总控口述_*'
      - 'tools/*ppt*'
      - 'controller/scheme_ppt_decoupling_contract.json'
      - '.github/workflows/validate_ppt.yml'

permissions:
  contents: read

jobs:
  validate-ppt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scheme/PPT separation first
        run: python tools/validate_scheme_ppt_decoupling.py
      - name: Validate PPT director and number provenance rules
        run: python tools/validate_ppt_director_rules.py
      - name: Install PPT dependencies
        run: python -m pip install --disable-pip-version-check python-pptx pillow lxml
      - name: Materialize fixed PPT pages
        run: python tools/materialize_ppt_fixed_pages.py
      - name: Validate fixed PPT pages
        run: python tools/validate_ppt_fixed_pages.py
      - name: Confirm independent PPT sources exist
        run: |
          test -f 05F_玩家教学PPT独立二次任务协议.md
          test -f 玩家教学PPT独立创建总控口述_V1.0.md
          test -f controller/scheme_ppt_decoupling_contract.json
