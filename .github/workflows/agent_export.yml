name: Agent repository export

on:
  push:
    branches:
      - agent/rebate-portfolio-50plus-5000-20260807
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package repository snapshot
        run: |
          tar --exclude=.git -czf /tmp/guaji5-source.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: guaji5-source
          path: /tmp/guaji5-source.tar.gz
          if-no-files-found: error
